<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Menú vegetariano de dos semanas, recetas, lista de la compra, despensa y guía de alimentos.">
<meta name="theme-color" content="#F3F5EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuines Jan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Cuines Jan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap">
<style>
  :root {
    --bg: #F3F5EF;
    --surface: #FFFFFF;
    --sunken: #E8EBE3;
    --ink: #1C211D;
    --muted: #5B645C;
    --line: #DADFD5;
    --accent: #6A2B5B;
    --accent-ink: #FFFFFF;
    --accent-soft: #F2E7EF;
    --olive: #55661A;
    --olive-soft: #EBEFD9;
    --olive-ink: #3E4B10;
    --season: #B4501A;
    --frz: #1F5F86;
    --frz-soft: #E3EEF5;
    --f-d: #2F7A4B;
    --f-s: #1F6F7A;
    --f-w: #9A5C16;
    --f-o: #6B7280;
    --f-p: #6A2B5B;
    --pill-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(28, 33, 29, 0.08);
    --display: "Young Serif", Georgia, "Times New Roman", serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    padding-inline: 16px; padding-block: 0;
    -webkit-tap-highlight-color: transparent;
  }
  body.lock { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 640px; margin: 0 auto; padding-block: 0 104px; }

  /* Cabecera */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); margin-inline: -16px; padding-inline: 16px;
    border-bottom: 1px solid var(--line);
  }
  .top-in { max-width: 640px; margin: 0 auto; padding-block: 12px 10px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .top h1 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
  .top .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }

  /* Barra inferior */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tabs button {
    background: none; border: 0; padding: 9px 2px 10px; color: var(--muted);
    font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tabs svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }

  /* Piezas comunes */
  .view { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
  .seg { display: flex; gap: 3px; background: var(--sunken); border-radius: 11px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 8px; font-weight: 700; color: var(--muted); font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 10px 0 -4px; }
  .lede { color: var(--muted); font-size: 14.5px; margin: 0; }
  .note-box { background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; color: var(--ink); }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 6px 12px; font-size: 14.5px; font-weight: 700; text-align: left;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .bdg { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; line-height: 1.5; }
  .bdg.batch { background: var(--olive-soft); color: var(--olive-ink); }
  .bdg.frz { background: var(--frz-soft); color: var(--frz); }
  .bdg.home { background: var(--accent-soft); color: var(--accent); }
  .bdg.pan { background: var(--sunken); color: var(--muted); }
  .bdg.today { background: var(--accent); color: var(--accent-ink); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: var(--pill-ink); white-space: nowrap; }
  .pill.d { background: var(--f-d); } .pill.s { background: var(--f-s); } .pill.w { background: var(--f-w); }
  .pill.o { background: var(--f-o); } .pill.p { background: var(--f-p); }
  .tmp { font-size: 11px; font-weight: 700; color: var(--season); border: 1px solid var(--season); border-radius: 4px; padding: 0 5px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Menú */
  .prep { background: var(--olive-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .prep-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .prep-day { font-family: var(--display); font-size: 18px; color: var(--olive-ink); }
  .prep-t { font-size: 14px; font-weight: 700; color: var(--olive-ink); font-variant-numeric: tabular-nums; }
  .prep .chip { background: var(--surface); border-color: transparent; }
  .order { margin: 0; padding-left: 20px; font-size: 14.5px; display: flex; flex-direction: column; gap: 3px; }
  .days { display: flex; flex-direction: column; gap: 10px; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 12px; }
  .day { scroll-margin-top: 164px; }
  .top-seg { margin-top: 10px; }
  .day.is-today {
    border-color: var(--accent); border-width: 2px; padding: 9px 13px 11px;
    background: rgba(106, 43, 91, 0.2);
    background: color-mix(in srgb, var(--accent) 20%, var(--surface));
  }
  .day-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .day-n { font-family: var(--display); font-size: 18px; }
  .meal { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding-block: 6px; border-top: 1px solid var(--line); }
  .meal:first-of-type { border-top: 0; }
  .ml { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; padding-top: 3px; }
  .rec-link { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; font-size: 16px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .day-prep { margin-top: 8px; background: var(--olive-soft); border-radius: 10px; padding: 8px 10px; font-size: 14.5px; color: var(--olive-ink); display: flex; flex-direction: column; gap: 6px; }
  .day-prep strong { font-weight: 700; }
  .day-prep .chip { background: var(--surface); border-color: transparent; color: var(--ink); }

  .seg.three button { padding-inline: 4px; font-size: 14.5px; }
  .slot { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding-block: 7px; border-top: 1px solid var(--line); }
  .slot-h { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; line-height: 1.2; }
  .slot-h span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .slot-note { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .slot-t { font-weight: 700; }
  .night { margin-top: 8px; background: var(--frz-soft); color: var(--frz); border-radius: 10px; padding: 8px 10px; font-size: 14.5px; font-weight: 700; }
  .why { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .why h3 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
  .why-row { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .why-row b { font-size: 15.5px; }
  .why-row .c { font-weight: 700; color: var(--olive-ink); background: var(--olive-soft); border-radius: 999px; padding: 1px 9px; font-size: 13px; align-self: start; font-variant-numeric: tabular-nums; }
  .why-row p { grid-column: 1 / -1; margin: 0; font-size: 14.5px; color: var(--muted); }

  /* Recetas */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .rrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 14px; }
  .rrow:first-child { border-top: 0; }
  .rn { font-weight: 700; font-size: 16px; }
  .rm { grid-column: 1; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rtags { grid-column: 1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .rarrow { grid-column: 2; grid-row: 1 / span 3; align-self: center; color: var(--muted); font-size: 20px; }

  /* Detalle de receta */
  .detail { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-inline: 16px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .d-in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .d-bar { position: sticky; top: 0; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; z-index: 2; }
  .back { background: none; border: 0; padding: 4px 0; font-weight: 700; color: var(--accent); font-size: 16px; }
  .d-title { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .meta div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .meta span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
  .meta b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .d-sec h3 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0 0 6px; }
  .ing { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .ing li { padding: 9px 12px; border-top: 1px solid var(--line); }
  .ing li:first-child { border-top: 0; }
  .steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 8px; }
  .steps li::before { content: counter(s); font-family: var(--display); color: var(--accent); font-size: 18px; line-height: 1.3; }
  .d-note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .d-note b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 2px; }
  .d-note.var { border-color: var(--season); }
  .appears { margin: 0; padding-left: 18px; font-size: 15px; color: var(--muted); }

  /* Compra */
  .progress { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14.5px; }
  .bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--olive); border-radius: 3px; transition: width 0.2s; }
  .grp h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 6px 0 6px; font-weight: 700; }
  .grp.brk h3 { color: var(--accent); }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 0 10px; align-items: start; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--olive); }
  .item .nm { font-weight: 700; }
  .item .qt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .item .for { grid-column: 2 / span 2; font-size: 13.5px; color: var(--muted); }
  .item .tags { grid-column: 2 / span 2; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
  .item.done .nm, .item.done .qt { text-decoration: line-through; color: var(--muted); }
  .hidden-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding: 8px 2px 0; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; font-weight: 700; width: 100%; }
  .btn.armed { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Despensa */
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
  .prow:first-child { border-top: 0; }
  .prow .nm { font-weight: 700; }
  .prow .use { grid-column: 1; font-size: 13.5px; color: var(--muted); }
  .toggle { grid-column: 2; grid-row: 1 / span 2; display: flex; background: var(--sunken); border-radius: 9px; padding: 2px; gap: 2px; }
  .toggle button { border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .toggle button[aria-pressed="true"].yes { background: var(--olive); color: var(--surface); }
  .toggle button[aria-pressed="true"].no { background: var(--season); color: var(--surface); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat b { font-family: var(--display); font-weight: 400; font-size: 26px; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13.5px; color: var(--muted); }

  /* Guía */
  .glance { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .glance h3 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0 0 6px; }
  .glance ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
  .glance li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; font-size: 15px; }
  .glance li::before { content: ""; width: 12px; height: 12px; border: 1.6px solid var(--olive); border-radius: 3px; margin-top: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  details.gsec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  details.gsec > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  details.gsec > summary::-webkit-details-marker { display: none; }
  details.gsec > summary::after { content: "+"; font-family: var(--display); font-size: 22px; color: var(--muted); line-height: 1; }
  details.gsec[open] > summary::after { content: "–"; }
  .gcount { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .gbody { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .gnote { font-size: 14px; color: var(--muted); margin: 0; }
  .glist { list-style: none; margin: 0; padding: 0; }
  .glist li { padding: 9px 0; border-top: 1px solid var(--line); }
  .gtop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .gtop strong { margin-right: 2px; }
  .gtop .pill { margin-left: auto; }
  .glist p { margin: 3px 0 0; font-size: 14.5px; color: var(--muted); }
  .glist .brand { color: var(--ink); font-size: 13.5px; }
  .blist { margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="top-in" id="top"></div></header>
  <main>
    <section class="view" id="v-menu" hidden></section>
    <section class="view" id="v-recetas" hidden></section>
    <section class="view" id="v-compra" hidden></section>
    <section class="view" id="v-despensa" hidden></section>
    <section class="view" id="v-guia" hidden></section>
  </main>
</div>

<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="d-title"></div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button data-tab="menu"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Menú</button>
    <button data-tab="recetas"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5M9 8.5h6"/></svg>Recetas</button>
    <button data-tab="compra"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 12.5a1.5 1.5 0 0 1-1.5 1.3H7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"/></svg>Compra</button>
    <button data-tab="despensa"><svg viewBox="0 0 24 24"><path d="M7 3.5h10v3H7z"/><path d="M6.5 6.5h11a1 1 0 0 1 1 1V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V7.5a1 1 0 0 1 1-1z"/><path d="M5.5 11h13"/></svg>Despensa</button>
    <button data-tab="guia"><svg viewBox="0 0 24 24"><path d="M19.5 4.5C11 4.5 5.5 8.5 5.5 15c0 2 .6 3.4 1.2 4.5"/><path d="M5.5 19.5c8.5 0 14-4 14-10.5V4.5"/><path d="M9 16c2.5-3 5.5-5 9-6.5"/></svg>Guía</button>
  </div>
</nav>

<script>
/* ============================================================
   DATOS
   ============================================================ */

// Catálogo de productos. c = sección del súper, u = unidad para sumar,
// p = básico de despensa (se oculta de la compra si lo tienes), x = aclaración de cantidad.
const ITEMS = {
  calabaza: { n: 'Calabaza', c: 'verdura', u: 'g' },
  zanahoria: { n: 'Zanahorias', c: 'verdura', u: 'ud' },
  puerro: { n: 'Puerros', c: 'verdura', u: 'ud' },
  cebolla: { n: 'Cebollas', c: 'verdura', u: 'ud' },
  pimiento_rojo: { n: 'Pimientos rojos', c: 'verdura', u: 'ud' },
  pimiento_verde: { n: 'Pimientos verdes', c: 'verdura', u: 'ud' },
  berenjena: { n: 'Berenjenas', c: 'verdura', u: 'ud' },
  brocoli: { n: 'Brócoli', c: 'verdura', u: 'ud' },
  espinacas: { n: 'Espinacas (frescas o congeladas)', c: 'verdura', u: 'g' },
  setas: { n: 'Setas o champiñones', c: 'verdura', u: 'g' },
  patata: { n: 'Patatas', c: 'verdura', u: 'g' },
  boniato: { n: 'Boniato', c: 'verdura', u: 'g' },
  tomate: { n: 'Tomates', c: 'verdura', u: 'ud' },
  aguacate: { n: 'Aguacates', c: 'verdura', u: 'ud' },
  limon: { n: 'Limones', c: 'verdura', u: 'ud' },
  rucula: { n: 'Rúcula', c: 'verdura', u: 'g' },
  fruta: { n: 'Fruta de temporada', c: 'verdura' },
  platanos: { n: 'Plátanos', c: 'verdura', u: 'ud' },
  manzanas: { n: 'Manzanas', c: 'verdura', u: 'ud' },

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (x) => String(Math.round(x * 10) / 10).replace('.', ',');

function fmtQty(key, e) {
  if (!e || !e.has) return '';
  const it = ITEMS[key];
  const q = e.q;
  let s = '';
  if (it.u === 'g') s = q >= 1000 ? num(q / 1000) + ' kg' : Math.round(q) + ' g';
  else if (it.u === 'ml') s = q >= 1000 ? num(q / 1000) + ' l' : Math.round(q) + ' ml';
  else if (it.u === 'reb') s = Math.ceil(q) + ' rebanadas';
  else if (it.u === 'ud') s = Math.ceil(q) + (it.uw ? ' ' + it.uw : '');
  if (it.x) s += ' ' + it.x;
  return s;
}

// Recetas que se cocinan en la semana: las del batch y las comidas que no salen del batch.
function recipesCooked(w) {
  const P = PLAN[w - 1];
  const ids = [];
  P.batch.forEach((s) => s.recipes.forEach((id) => ids.push(id)));
  P.days.forEach((d) => ['c', 'n'].forEach((m) => { if (!d[m].b && !d[m].f) ids.push(d[m].r); }));
  return ids;
}

function aggregate(w) {
  const m = {};
  recipesCooked(w).forEach((id) => {
    R[id].ing.forEach(([k, q]) => {
      if (!ITEMS[k]) return;
      const e = m[k] || (m[k] = { q: 0, has: false, rec: [] });
      if (q != null) { e.q += q; e.has = true; }
      if (!e.rec.includes(R[id].n)) e.rec.push(R[id].n);
    });
  });
  return m;
}

// Lo que gastan las otras comidas en una semana (lunes a viernes, más la creatina del fin de semana).
function aggregateBreakfast() {
  const m = {};
  const add = (k, q) => {
    if (!ITEMS[k]) return;
    const e = m[k] || (m[k] = { q: 0, has: false, rec: [] });
    if (q != null) { e.q += q; e.has = true; }
  };
  OTHER.forEach((d) => d.m.forEach((x) => {
    if (x.r && B[x.r].buy) B[x.r].buy.forEach(([k, q]) => add(k, q));
    if (x.buy) x.buy.forEach(([k, q]) => add(k, q));
  }));
  add('creatina', 10);
  return m;
}

// Suma comidas y cenas con las otras comidas.
function mergeTotals(agg, bagg) {
  const t = {};
  Object.keys(agg).forEach((k) => { t[k] = { q: agg[k].q, has: agg[k].has, rec: agg[k].rec.slice() }; });
  Object.keys(bagg).forEach((k) => {
    const e = t[k] || (t[k] = { q: 0, has: false, rec: [] });
    if (bagg[k].has) { e.q += bagg[k].q; e.has = true; }
    e.rec.push('tus desayunos y meriendas');
  });
  return t;
}

function appearances(id) {
  const out = [];
  PLAN.forEach((P, wi) => {
    P.batch.forEach((s) => { if (s.recipes.includes(id)) out.push(`Semana ${wi + 1} · se prepara el ${s.day.toLowerCase()}`); });
    P.days.forEach((d) => {
      if (d.c.r === id) out.push(`Semana ${wi + 1} · ${d.d.toLowerCase()} · comida`);
      if (d.n.r === id) out.push(`Semana ${wi + 1} · ${d.d.toLowerCase()} · cena`);
    });
  });
  return out;
}

function renderCompra() {
  const w = state.week, agg = aggregate(w), bagg = aggregateBreakfast(), tot = mergeTotals(agg, bagg), ck = weekChecks();
  let hidden = 0, total = 0, done = 0;
  const visible = (k) => !(ITEMS[k].p && isHave(k) && !ck[k]);
  let groups = '';
  SHOP_CATS.forEach(([c, label]) => {
    const keys = Object.keys(ITEMS).filter((k) => ITEMS[k].c === c && agg[k]);
    const rows = [];
    keys.forEach((k) => {
      if (!visible(k)) { hidden++; return; }
      total++; if (ck[k]) done++;
      let tags = ITEMS[k].p ? '<span class="bdg pan">Despensa</span>' : '';
      if (bagg[k]) tags += '<span class="bdg home">Incluye tus desayunos</span>';
      rows.push(itemRow(k, fmtQty(k, tot[k]), 'Para: ' + tot[k].rec.join(', '), tags));
    });
    if (rows.length) groups += `<div class="grp"><h3>${esc(label)}</h3><div class="list">${rows.join('')}</div></div>`;
  });

  const brkRows = [];
  const brkKeys = BREAKFAST_KEYS.concat(Object.keys(bagg).filter((k) => !BREAKFAST_KEYS.includes(k)));
  brkKeys.forEach((k) => {
    if (agg[k] && ITEMS[k].c !== 'desayuno') return; // ya está en la lista principal, con la cantidad sumada
    if (!visible(k)) { hidden++; return; }
    total++; if (ck[k]) done++;
    const e = tot[k];
    brkRows.push(itemRow(k, e ? fmtQty(k, e) : '', agg[k] ? 'También para: ' + agg[k].rec.join(', ') : '', ITEMS[k].p ? '<span class="bdg pan">Despensa</span>' : ''));
  });
  if (brkRows.length) groups += `<div class="grp brk"><h3>Desayunos, meriendas y postres</h3><div class="list">${brkRows.join('')}</div></div>`;

  const pct = total ? Math.round((done / total) * 100) : 0;
  let h = weekSeg();
  h += `<div><div class="progress"><span><b>${done}</b> de ${total} en el carro</span><span>${pct} %</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  h += `<p class="note-box">Setas, espinacas frescas y rúcula aguantan 4–5 días. Si puedes, cómpralas el jueves.</p>`;
  h += groups;
  if (hidden) h += `<div class="hidden-note"><span>${hidden} básicos no aparecen porque ya los tienes.</span><button class="link" data-goto="despensa">Ver despensa</button></div>`;
  h += `<button class="btn${state.armed ? ' armed' : ''}" data-reset>${state.armed ? 'Toca otra vez para vaciar el carro' : 'Empezar lista nueva'}</button>`;
  $('#v-compra').innerHTML = h;
}

  const agg = mergeTotals(aggregate(state.week), aggregateBreakfast());
  const keys = Object.keys(ITEMS).filter((k) => ITEMS[k].p);

  $('#v-despensa').innerHTML = h;
}

function render() {
  TABS.forEach((t) => { $('#v-' + t).hidden = t !== state.tab; });

// Lleva la vista al día de hoy en el menú. Si hoy no sale (fin de semana en Otras comidas), sube arriba.
function focusToday(smooth) {
  const el = document.querySelector('#v-menu .day.is-today');
  if (!el) { window.scrollTo(0, 0); return; }
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({ block: 'start', behavior: smooth && !reduce ? 'smooth' : 'auto' });
}

function setTab(t) {
  state.tab = t; state.armed = false; store.set('tab', t);
  try { history.replaceState(null, '', '#' + t); } catch (e) { /* sin historial */ }
  render();
  if (t === 'menu') focusToday(true); else window.scrollTo(0, 0);
}
function openDetail(id) {
  state.detail = id; renderDetail();
  const d = $('#detail'); d.hidden = false; d.scrollTop = 0;
  document.body.classList.add('lock');
  const b = $('.back', d); if (b) b.focus();
}
function closeDetail() {
  $('#detail').hidden = true; document.body.classList.remove('lock'); state.detail = null;
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.goto) return setTab(t.dataset.goto);
  if (t.hasAttribute('data-other')) { state.menuOther = true; store.set('menuOther', true); render(); focusToday(true); return; }
  if (t.dataset.week) { state.week = Number(t.dataset.week); state.menuOther = false; store.set('menuOther', false); state.armed = false; store.set('week', state.week); render(); if (state.tab === 'menu') focusToday(true); return; }
  if (t.dataset.seg) { state.recSeg = t.dataset.seg; store.set('recSeg', state.recSeg); render(); return; }
  if (t.dataset.rec) return openDetail(t.dataset.rec);
  if (t.hasAttribute('data-back')) return closeDetail();
  if (t.dataset.pan) { state.pantry[t.dataset.pan] = t.dataset.v; store.set('pantry', state.pantry); render(); return; }
  if (t.hasAttribute('data-reset')) {
    if (!state.armed) {
      state.armed = true; render();
      setTimeout(() => { if (state.armed) { state.armed = false; if (state.tab === 'compra') render(); } }, 4000);
    } else {
      state.checks['w' + state.week] = {}; store.set('checks', state.checks); state.armed = false; render();
    }
  }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (!el.matches('[data-ck]')) return;
  const k = el.dataset.ck, ck = weekChecks();
  if (el.checked) { ck[k] = true; if (ITEMS[k].p) state.pantry[k] = 'tengo'; }
  else { delete ck[k]; if (ITEMS[k].p) state.pantry[k] = 'falta'; }
  store.set('checks', state.checks); store.set('pantry', state.pantry);
  const row = el.closest('.item'); if (row) row.classList.toggle('done', el.checked);
  // Actualiza el progreso sin redibujar la lista.
  const boxes = document.querySelectorAll('#v-compra [data-ck]');
  const done = [...boxes].filter((b) => b.checked).length;
  const pct = boxes.length ? Math.round((done / boxes.length) * 100) : 0;
  const p = $('#v-compra .progress');
  if (p) { p.innerHTML = `<span><b>${done}</b> de ${boxes.length} en el carro</span><span>${pct} %</span>`; $('#v-compra .bar i').style.width = pct + '%'; }
});

document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && state.detail) closeDetail(); });

render();
if (state.tab === 'menu') setTimeout(() => focusToday(false), 60);
</script>
</body>
